<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life & Death - Sophie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .back {
            position: fixed;
            top: 22px;
            left: 25px;
            z-index: 10;
            font-size: 12px;
        }

        .back a {
            color: inherit;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .viewer {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            display: block;
        }

        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #111;
            padding: 30px;
            opacity: 0.35;
            z-index: 5;
        }

        .arrow:hover {
            opacity: 1;
        }

        .left {
            left: 0;
        }

        .right {
            right: 0;
        }

        .counter {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            opacity: 0.5;
        }

        @media (max-width: 600px) {

            .page {
                max-width: 88vw;
                max-height: 82vh;
            }

            .arrow {
                font-size: 20px;
                padding: 20px;
            }

            .back {
                top: 18px;
                left: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="back">
        <a href="ruminations.html">← BACK</a>
    </div>

    <div class="viewer">

        <button class="arrow left" onclick="previousPage()">←</button>

        <img
            id="page"
            class="page"
            src="images/ruminations/life-and-death/1.png"
            alt="Life & Death page 1"
        >

        <button class="arrow right" onclick="nextPage()">→</button>

    </div>

    <div class="counter">
        <span id="counter">1 / 47</span>
    </div>

    <script>

        let currentPage = 1;
        const totalPages = 47;

        const image = document.getElementById("page");
        const counter = document.getElementById("counter");

        function imagePath(page) {
            return "images/ruminations/life-and-death/" + page + ".png";
        }

        function preload(page) {
            if (page >= 1 && page <= totalPages) {
                const img = new Image();
                img.src = imagePath(page);
            }
        }

        function updatePage() {

            image.src = imagePath(currentPage);

            image.alt = "Life & Death page " + currentPage;

            counter.textContent =
                currentPage + " / " + totalPages;

            preload(currentPage + 1);
            preload(currentPage - 1);
        }

        function nextPage() {

            if (currentPage < totalPages) {
                currentPage++;
                updatePage();
            }
        }

        function previousPage() {

            if (currentPage > 1) {
                currentPage--;
                updatePage();
            }
        }

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowRight") {
                nextPage();
            }

            if (event.key === "ArrowLeft") {
                previousPage();
            }

        });

        let startX = 0;

        document.addEventListener("touchstart", function(event) {
            startX = event.touches[0].clientX;
        });

        document.addEventListener("touchend", function(event) {

            const endX = event.changedTouches[0].clientX;
            const difference = endX - startX;

            if (Math.abs(difference) > 50) {

                if (difference < 0) {
                    nextPage();
                } else {
                    previousPage();
                }

            }

        });

        document.addEventListener("click", function(event) {

            if (event.target.closest(".arrow") ||
                event.target.closest(".back")) {
                return;
            }

            if (event.clientX < window.innerWidth / 2) {
                previousPage();
            } else {
                nextPage();
            }

        });

        preload(2);

    </script>

</body>
</html>
