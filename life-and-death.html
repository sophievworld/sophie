<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life & Death - Sophie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .back {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 10;
            font-size: 14px;
        }

        .back a {
            color: inherit;
            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

        .viewer {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
        }

        .arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #111;
            padding: 20px;
            z-index: 5;
        }

        .arrow:hover {
            opacity: 0.5;
        }

        .left {
            left: 20px;
        }

        .right {
            right: 20px;
        }

        .counter {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="back">
        <a href="ruminations.html">← BACK</a>
    </div>

    <div class="viewer">

        <button class="arrow left" onclick="previousPage()">←</button>

    <img id="page" class="page" src="images/ruminations/life-and-death/1.png" alt="Life & Death page 1">

        <button class="arrow right" onclick="nextPage()">→</button>

    </div>

    <div class="counter">
        <span id="counter">1 / 47</span>
    </div>

    <script>

        let currentPage = 1;
        const totalPages = 47;

        function updatePage() {

            const image = document.getElementById("page");

         image.src = "images/ruminations/life-and-death/" + currentPage + ".png";

            image.alt = "Life & Death page " + currentPage;

            document.getElementById("counter").textContent =
                currentPage + " / " + totalPages;
        }

        function nextPage() {

            if (currentPage < totalPages) {
                currentPage++;
                updatePage();
            }
        }

        function previousPage() {

            if (currentPage > 1) {
                currentPage--;
                updatePage();
            }
        }

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowRight") {
                nextPage();
            }

            if (event.key === "ArrowLeft") {
                previousPage();
            }

        });

    </script>

</body>
</html>
