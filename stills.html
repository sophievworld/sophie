<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stills - Sophie</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #111;
            background: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            margin-bottom: 60px;
        }

        .title {
            margin-bottom: 20px;
        }

        .year {
            margin-bottom: 60px;
        }

        .gallery {
            position: relative;
            width: 100%;
            min-height: 5000px;
        }

        .photo {
            position: absolute;
            width: 24vw;
            max-width: 380px;
            min-width: 180px;
            transition: transform 0.4s ease;
        }

        .photo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .photo:hover {
            transform: scale(1.04);
            z-index: 10;
        }

        /* Individual positions */

        .photo:nth-child(1)  { left: 4%;  top: 20px; }
        .photo:nth-child(2)  { left: 48%; top: 80px; }
        .photo:nth-child(3)  { left: 72%; top: 30px; }
        .photo:nth-child(4)  { left: 22%; top: 420px; }
        .photo:nth-child(5)  { left: 58%; top: 500px; }
        .photo:nth-child(6)  { left: 5%;  top: 700px; }
        .photo:nth-child(7)  { left: 38%; top: 820px; }
        .photo:nth-child(8)  { left: 76%; top: 760px; }
        .photo:nth-child(9)  { left: 15%; top: 1100px; }
        .photo:nth-child(10) { left: 55%; top: 1150px; }
        .photo:nth-child(11) { left: 78%; top: 1280px; }
        .photo:nth-child(12) { left: 2%;  top: 1450px; }
        .photo:nth-child(13) { left: 34%; top: 1500px; }
        .photo:nth-child(14) { left: 64%; top: 1600px; }
        .photo:nth-child(15) { left: 18%; top: 1800px; }
        .photo:nth-child(16) { left: 50%; top: 1900px; }
        .photo:nth-child(17) { left: 75%; top: 1850px; }
        .photo:nth-child(18) { left: 5%;  top: 2150px; }
        .photo:nth-child(19) { left: 40%; top: 2200px; }
        .photo:nth-child(20) { left: 68%; top: 2300px; }

        .photo:nth-child(3n) {
            width: 18vw;
        }

        .photo:nth-child(4n) {
            width: 28vw;
        }

        .photo:nth-child(5n) {
            width: 20vw;
        }

        @media (max-width: 800px) {

            body {
                padding: 25px;
            }

            .gallery {
                min-height: 6500px;
            }

            .photo {
                width: 42vw !important;
                min-width: 130px;
            }

            .photo:nth-child(1)  { left: 2%;  top: 20px; }
            .photo:nth-child(2)  { left: 48%; top: 120px; }
            .photo:nth-child(3)  { left: 15%; top: 400px; }
            .photo:nth-child(4)  { left: 55%; top: 500px; }
            .photo:nth-child(5)  { left: 5%;  top: 750px; }
            .photo:nth-child(6)  { left: 50%; top: 850px; }
            .photo:nth-child(7)  { left: 15%; top: 1150px; }
            .photo:nth-child(8)  { left: 55%; top: 1250px; }
            .photo:nth-child(9)  { left: 2%;  top: 1550px; }
            .photo:nth-child(10) { left: 50%; top: 1650px; }
        }

        @media (max-width: 500px) {

            .gallery {
                min-height: 9000px;
            }

            .photo {
                width: 70vw !important;
            }

            .photo:nth-child(odd) {
                left: 5%;
            }

            .photo:nth-child(even) {
                left: 25%;
            }
        }
    </style>
</head>

<body>

    <div class="back">
        <a href="index.html">← BACK</a>
    </div>

    <div class="title">
        CAMERA
    </div>

    <div class="year">
        2024–2026
    </div>

    <div class="gallery" id="gallery"></div>

    <script>

        fetch("stills.json")
            .then(response => response.json())
            .then(data => {

                const gallery = document.getElementById("gallery");

                data.photos.forEach(filename => {

                    const container = document.createElement("div");
                    container.className = "photo";

                    const image = document.createElement("img");

                    image.src =
                        data.folder +
                        encodeURIComponent(filename);

                    image.alt = "";

                    container.appendChild(image);
                    gallery.appendChild(container);

                });

            })
            .catch(error => {
                console.error("Could not load stills:", error);
            });

    </script>

</body>
</html>
