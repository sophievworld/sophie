<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stills - Sophie</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #111;
            background: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            margin-bottom: 60px;
        }

        .title {
            margin-bottom: 80px;
        }

        .year {
            margin-bottom: 50px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 80px 50px;
            padding-bottom: 120px;
        }

        .photo {
            width: 22vw;
            max-width: 420px;
            min-width: 180px;
        }

        .photo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .photo:hover {
            opacity: 0.9;
        }

        @media (max-width: 800px) {
            body {
                padding: 25px;
            }

            .photo {
                width: 42vw;
                min-width: 140px;
            }

            .gallery {
                gap: 50px 20px;
            }
        }

        @media (max-width: 500px) {
            .photo {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="back">
        <a href="index.html">← BACK</a>
    </div>

    <div class="title">
        CAMERA
    </div>

    <div class="year">
        2024–2026
    </div>

    <div class="gallery" id="gallery"></div>

    <script>

        fetch("stills.json")
            .then(response => response.json())
            .then(data => {

                const gallery = document.getElementById("gallery");

                data.photos.forEach(filename => {

                    const container = document.createElement("div");
                    container.className = "photo";

                    const image = document.createElement("img");

                    image.src =
                        data.folder +
                        encodeURIComponent(filename);

                    image.alt = "";

                    container.appendChild(image);
                    gallery.appendChild(container);

                });

            })
            .catch(error => {
                console.error("Could not load stills:", error);
            });

    </script>

</body>
</html>
