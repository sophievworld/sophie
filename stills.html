<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stills - Sophie</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #111;
            background: #fff;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            margin-bottom: 60px;
        }

        .title {
            margin-bottom: 20px;
        }

        .year {
            margin-bottom: 60px;
        }

        /*
        The gallery grows automatically depending
        on how many photographs are loaded.
        */

        .gallery {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        .photo {
            position: absolute;
            width: 24vw;
            max-width: 360px;
            min-width: 180px;
            transition: transform 0.4s ease;
        }

        .photo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .photo:hover {
            transform: scale(1.04);
            z-index: 100;
        }

        @media (max-width: 800px) {

            body {
                padding: 25px;
            }

            .photo {
                width: 40vw;
                min-width: 130px;
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .photo {
                width: 65vw;
                min-width: 120px;
            }
        }
    </style>
</head>

<body>

    <div class="back">
        <a href="index.html">← BACK</a>
    </div>

    <div class="title">
        CAMERA
    </div>

    <div class="year">
        2024–2026
    </div>

    <div class="gallery" id="gallery"></div>

    <script>

        fetch("stills.json")
            .then(response => response.json())
            .then(data => {

                const gallery = document.getElementById("gallery");

                const photos = data.photos;

                /*
                These positions create a loose, scattered
                composition without allowing the images
                to collapse into one another.

                The pattern repeats with variation, so it
                continues automatically beyond 20 images.
                */

                const positions = [
                    [4, 0],
                    [47, 80],
                    [73, 30],
                    [21, 430],
                    [57, 520],
                    [4, 760],
                    [38, 850],
                    [74, 780],
                    [15, 1160],
                    [54, 1200],
                    [78, 1350],
                    [2, 1530],
                    [34, 1620],
                    [64, 1680],
                    [18, 1930],
                    [50, 2020],
                    [76, 1970],
                    [5, 2260],
                    [40, 2340],
                    [68, 2420]
                ];

                const rowHeight = 2700;

                photos.forEach((filename, index) => {

                    const container = document.createElement("div");
                    container.className = "photo";

                    const image = document.createElement("img");

                    image.src =
                        data.folder +
                        encodeURIComponent(filename);

                    image.alt = "";

                    container.appendChild(image);
                    gallery.appendChild(container);

                    /*
                    Repeat the positioning pattern vertically
                    for every group of 20 photographs.
                    */

                    const patternIndex = index % positions.length;
                    const cycle = Math.floor(index / positions.length);

                    const position = positions[patternIndex];

                    const left = position[0];

                    /*
                    Small deterministic variations prevent
                    repeated rows from looking identical.
                    */

                    const variation =
                        ((index * 37) % 90) - 45;

                    const top =
                        position[1] +
                        (cycle * rowHeight) +
                        variation;

                    container.style.left = left + "%";
                    container.style.top = top + "px";

                    /*
                    Vary photograph sizes slightly.
                    */

                    const sizePattern = index % 5;

                    if (sizePattern === 0) {
                        container.style.width = "23vw";
                    }

                    if (sizePattern === 1) {
                        container.style.width = "19vw";
                    }

                    if (sizePattern === 2) {
                        container.style.width = "26vw";
                    }

                    if (sizePattern === 3) {
                        container.style.width = "21vw";
                    }

                    if (sizePattern === 4) {
                        container.style.width = "24vw";
                    }

                });

                /*
                Calculate the total height of the gallery
                automatically based on the number of images.
                */

                const totalCycles =
                    Math.ceil(photos.length / positions.length);

                gallery.style.minHeight =
                    (totalCycles * rowHeight + 1000) + "px";

            })
            .catch(error => {
                console.error("Could not load stills:", error);
            });

    </script>

</body>
</html>
