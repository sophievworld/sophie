<!DOCTYPE html>

    <title>Sophie Cole</title>

    <style>

        * {

        }

        body {
            margin: 0;
            background: #fff;
            color: #111;

            font-size: 14px;

            height: auto;
            margin: 0 auto;

        .group {

        .category {
            margin: 14px 0;
        }

        /* CATEGORY TITLES */

        .category > a {
            color: inherit;
            text-decoration: none;
        }

        .category > a:hover {
            text-decoration: underline;
        }

        /* SUBMENU */

        .contents {
            display: none;
            margin-top: 12px;
            margin-bottom: 22px;
        }

        .contents.open {
            display: block;
        }

        .work {
            margin: 8px 0;
        }

        .work a {
            color: inherit;
            text-decoration: none;
        }

        .work a:hover {
            text-decoration: underline;
        }

        /* SPACE BETWEEN THE TWO GROUPS */

        .separator {

</head>
