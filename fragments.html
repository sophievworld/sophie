<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fragments - Sophie</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #fff;
            color: #111;
            font-family: Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back {
            margin-bottom: 70px;
            font-size: 12px;
        }

        .fragments {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 100px;
        }

        .fragments img {
            display: block;
            max-width: 85vw;
            max-height: 90vh;
            width: auto;
            height: auto;
        }

    </style>

</head>

<body>

    <div class="back">
        <a href="index.html">← BACK</a>
    </div>

    <div class="fragments">

</html>
